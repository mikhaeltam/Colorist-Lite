<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Colorist Lite compare</title>
<!--
  One file, many comparisons. Pick the scene with ?s=N in the iframe URL.
  Each scene names its before/after images (in images/, identical dimensions per pair).
  Add a scene: add an entry to SCENES below, then embed with ?s=<key>.
-->
<style>
  html,body{margin:0;padding:0;overflow:hidden;height:100%;background:rgb(7,4,18);}
  #wrap{position:relative;width:100%;height:100%;cursor:ew-resize;user-select:none;-webkit-user-select:none;touch-action:pan-y;}
  #wrap img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;}
  #after{clip-path:inset(0 0 0 50%);-webkit-clip-path:inset(0 0 0 50%);}
  #line{position:absolute;top:0;bottom:0;left:50%;width:2px;margin-left:-1px;background:#f5f5f7;pointer-events:none;}
  #knob{position:absolute;top:50%;left:50%;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;
        background:#f5f5f7;box-shadow:0 2px 12px rgba(0,0,0,.35);pointer-events:none;
        font:600 13px/40px Inter,'Helvetica Neue',Helvetica,Arial,sans-serif;color:#07040f;text-align:center;letter-spacing:-1px;}
  .tag{position:absolute;bottom:16px;padding:7px 12px;border-radius:100px;background:rgba(7,4,18,.6);
       font:600 10px/1 Inter,'Helvetica Neue',Helvetica,Arial,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:#f5f5f7;pointer-events:none;}
  #tagL{left:16px;} #tagR{right:16px;}
</style>
</head>
<body>
<div id="wrap">
  <img id="before" alt="Before">
  <img id="after" alt="Graded with Colorist Lite">
  <div id="line"></div>
  <div id="knob">&#8249;&#8250;</div>
  <div class="tag" id="tagL">Raw</div>
  <div class="tag" id="tagR">Colorist Lite</div>
</div>
<script>
  // start = initial divider position in %
  var SCENES = {
    1: { name: 'subway-station', start: 50 },   // 1920x816, 2.35:1
    2: { name: 'robot-subway',   start: 50 }    // 1080x1080, square
  };

  var s = new URLSearchParams(location.search).get('s') || '1';
  var scene = SCENES[s] || SCENES[1];
  var wrap = document.getElementById('wrap'),
      before = document.getElementById('before'),
      after = document.getElementById('after'),
      line = document.getElementById('line'),
      knob = document.getElementById('knob');

  before.src = 'images/' + scene.name + '-before.jpg';
  after.src  = 'images/' + scene.name + '-after.jpg';

  function set(p) {
    p = Math.max(0, Math.min(100, p));
    var c = 'inset(0 0 0 ' + p + '%)';
    after.style.clipPath = c; after.style.webkitClipPath = c;
    line.style.left = knob.style.left = p + '%';
  }
  function fromX(x) {
    var r = wrap.getBoundingClientRect();
    set((x - r.left) / r.width * 100);
  }

  var drag = false;
  wrap.addEventListener('mousedown', function (e) { drag = true; fromX(e.clientX); });
  window.addEventListener('mousemove', function (e) { if (drag) fromX(e.clientX); });
  window.addEventListener('mouseup', function () { drag = false; });
  wrap.addEventListener('touchstart', function (e) { drag = true; fromX(e.touches[0].clientX); }, { passive: true });
  wrap.addEventListener('touchmove', function (e) {
    if (drag) { e.preventDefault(); fromX(e.touches[0].clientX); }
  }, { passive: false });
  window.addEventListener('touchend', function () { drag = false; });

  set(scene.start);
</script>
</body>
</html>
