<title>Colorist Lite footer</title>
<!--
  Colorist Lite footer card: the same light-leak effect as cl-hero.html, with the
  footer (name, tagline, links, copyright) in front. Links open in a new tab.
  Effect code is copied from cl-hero.html; if you retune one, copy the change across.
-->
<style>
/* Colorist Lite hero card background: fills its window or iframe — a soft rainbow light leak drifts with the cursor over a colour wash; scan lines on top */
@property --p-angle { syntax: "<angle>"; inherits: true; initial-value: 0deg; }

:root {
  --bg: rgb(7,4,18);
  --mx: 50%; --my: 50%;   /* smoothed pointer position (set by JS) */
  --p-on: 0;
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; padding: 0; }
body { background: var(--bg); overflow: hidden; touch-action: none; }

.prism, .prism > * { position: fixed; inset: 0; pointer-events: none; }

/* Colour wash spun around the pointer, heavily blurred */
.prism-spectrum {
  inset: -30%;
  background: conic-gradient(from var(--p-angle) at var(--mx) var(--my),
    #ff2d55, #ff9f0a, #ffd60a, #30d158, #40c8e0, #0a84ff, #5e5ce6, #bf5af2, #ff2d55);
  filter: blur(60px) saturate(1.3);
  opacity: calc(.45 + .2 * var(--p-on));
  animation: p-spin 20s linear infinite;
}
@keyframes p-spin { to { --p-angle: 360deg; } }
.prism-shade {
  background: radial-gradient(circle at var(--mx) var(--my),
    transparent 0%, rgba(7,4,18,.35) 40%, rgba(7,4,18,.85) 95%);
}

/* The light leak, drawn at half resolution and blurred into soft bands */
.prism-leak { width: 100%; height: 100%; filter: blur(28px) saturate(1.15); mix-blend-mode: screen; }

/* Scan lines + slow rolling band */
.prism-scan { background: repeating-linear-gradient(to bottom, rgba(0,0,0,.58) 0 1px, transparent 1px 3px); }
.prism-roll {
  background: linear-gradient(to bottom, transparent 40%, rgba(255,255,255,.06) 50%, transparent 60%);
  background-size: 100% 250%;
  animation: p-roll 7s linear infinite;
}
@keyframes p-roll { from { background-position: 0 130%; } to { background-position: 0 -130%; } }

/* Footer content in front of the effect — mirrors the Nebulapunk footer, dark */
.foot { position: relative; z-index: 2; box-sizing: border-box; padding: 44px 40px 32px 40px;
        font-family: Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif; letter-spacing: .01em; }
.foot h2 { margin: 0 0 10px 0; padding: 0; font-size: 24px; font-weight: 600; letter-spacing: -.02em; color: #f5f5f7; line-height: 1.2; }
.tag  { margin: 0 0 6px 0; font-size: 13px; font-weight: 500; color: #d6d3e0; line-height: 1.6; }
.desc { margin: 0 0 24px 0; max-width: 400px; font-size: 13px; font-weight: 400; color: #a9a6b8; line-height: 1.7; }
.socials { display: flex; align-items: center; gap: 16px; height: 24px; }
.socials a { display: block; width: 20px; height: 20px; color: #f5f5f7; transition: transform .12s ease, opacity .12s ease; }
.socials a svg { display: block; width: 20px; height: 20px; fill: currentColor; }
.socials a:hover { transform: translateY(1px) scale(0.88); opacity: .7; }
.socials a:active { transform: translateY(1px) scale(0.8); }
.cols { display: flex; margin-top: 48px; }
.col  { width: 25%; box-sizing: border-box; padding: 0 16px 0 0; }
.col h3 { margin: 0 0 14px 0; font-size: 12px; font-weight: 400; color: #8d8aa6; line-height: 1.5; }
.col a  { display: block; margin: 0 0 10px 0; font-size: 13px; font-weight: 400; color: #d6d3e0; text-decoration: none; line-height: 1.5; }
.col a:last-child { margin-bottom: 0; }
.col a:hover { color: #14f0d2; }
.foot hr { border: none; border-top: 1px solid rgba(245,245,247,.08); margin: 32px 0 20px 0; height: 0; }
.copy { font-size: 12px; font-weight: 400; color: #8d8aa6; line-height: 1.7; }
@media (max-width: 520px) { .col { width: 50%; } }

@media (prefers-reduced-motion: reduce) {
  .prism-spectrum, .prism-roll { animation: none; }
}
</style>

<script>
(() => {
  const root = document.documentElement;
  const cv = document.getElementById('leak');
  const ctx = cv.getContext('2d');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  const SCALE = 0.5;     // render resolution (blurred anyway)
  const SLICES = 24;     // spectrum resolution
  const WIDTH = 0.45;    // band width as a fraction of the shorter screen side
  const FAN = 0.35;      // how much the band widens toward its ends

  let W = 0, H = 0;
  function resize() {
    W = cv.width = Math.round(innerWidth * SCALE);
    H = cv.height = Math.round(innerHeight * SCALE);
  }
  addEventListener('resize', resize); resize();

  // Wavelength (nm) → RGB, yellow-green brightest, red/violet softer
  function spectral(nm) {
    let r = 0, g = 0, b = 0;
    if (nm < 440) { r = -(nm - 440) / 60; b = 1; }
    else if (nm < 490) { g = (nm - 440) / 50; b = 1; }
    else if (nm < 510) { g = 1; b = -(nm - 510) / 20; }
    else if (nm < 580) { r = (nm - 510) / 70; g = 1; }
    else if (nm < 645) { r = 1; g = -(nm - 645) / 65; }
    else { r = 1; }
    const edge = nm < 420 ? .4 + .6 * (nm - 380) / 40 : nm > 700 ? .4 + .6 * (750 - nm) / 50 : 1;
    const lum = .6 + .4 * Math.exp(-Math.pow((nm - 565) / 90, 2));
    return [r, g, b].map(v => Math.round(255 * Math.pow(Math.max(0, v * edge * lum), .8)));
  }

  // Each colour trails the cursor at its own speed, so fast moves smear the band apart
  const slices = Array.from({ length: SLICES }, (_, i) => {
    const t = i / (SLICES - 1);
    return { t, rgb: spectral(700 - t * 300), k: .16 - .1 * t, x: .5, y: .5 };
  });

  let tx = .5, ty = .5, cx = .5, cy = .5, on = 0, present = false, lastMove = 0, rot = -.5;
  addEventListener('pointermove', e => {
    tx = e.clientX / innerWidth; ty = e.clientY / innerHeight;
    present = true; lastMove = performance.now();
  });
  document.addEventListener('pointerleave', () => { present = false; });
  addEventListener('blur', () => { present = false; });

  function frame(now) {
    const s = now / 1000;
    const idle = !present || now - lastMove > 4000;
    if (idle) {
      tx = .5 + Math.sin(s * .21) * .28;
      ty = .5 + Math.cos(s * .16) * .22;
    }
    on += ((idle ? 0 : 1) - on) * .05;

    const pcx = cx, pcy = cy;
    cx += (tx - cx) * (reduce ? 1 : .12);
    cy += (ty - cy) * (reduce ? 1 : .12);
    for (const sl of slices) {
      const k = reduce ? 1 : sl.k;
      sl.x += (tx - sl.x) * k; sl.y += (ty - sl.y) * k;
    }

    // Band angle: slow drift, leans with horizontal position and with motion
    const vx = (cx - pcx) * innerWidth, vy = (cy - pcy) * innerHeight;
    const target = -.55 + Math.sin(s * .07) * .25 + (cx - .5) * .6
                 + Math.max(-.3, Math.min(.3, (vy - vx * .4) * .03));
    rot += (target - rot) * .05;

    root.style.setProperty('--mx', (cx * 100).toFixed(2) + '%');
    root.style.setProperty('--my', (cy * 100).toFixed(2) + '%');
    root.style.setProperty('--p-on', on.toFixed(3));

    const band = Math.min(W, H) * WIDTH * (1 + Math.sin(s * .5) * .08);  // slow breathing
    const len = Math.hypot(W, H) * 1.3;
    const step = band / SLICES;
    const gain = .8 + .2 * on;

    ctx.clearRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'lighter';

    for (const sl of slices) {
      const [r, g, b] = sl.rgb;
      const off = (sl.t - .5) * band;          // position across the band
      ctx.save();
      ctx.translate(sl.x * W, sl.y * H);
      ctx.rotate(rot);

      // fade toward both ends; a little brighter around the cursor
      const grad = ctx.createLinearGradient(-len / 2, 0, len / 2, 0);
      grad.addColorStop(0, `rgba(${r},${g},${b},0)`);
      grad.addColorStop(.35, `rgba(${r},${g},${b},${.18 * gain})`);
      grad.addColorStop(.5, `rgba(${r},${g},${b},${.32 * gain})`);
      grad.addColorStop(.65, `rgba(${r},${g},${b},${.18 * gain})`);
      grad.addColorStop(1, `rgba(${r},${g},${b},0)`);
      ctx.fillStyle = grad;

      // each stripe fans outward slightly toward its ends
      const th = step * 2.4;
      const spread = off * FAN;
      ctx.beginPath();
      ctx.moveTo(-len / 2, off - spread - th / 2);
      ctx.lineTo(0, off - th / 2);
      ctx.lineTo(len / 2, off + spread - th / 2);
      ctx.lineTo(len / 2, off + spread + th / 2);
      ctx.lineTo(0, off + th / 2);
      ctx.lineTo(-len / 2, off - spread + th / 2);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    ctx.globalCompositeOperation = 'source-over';
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
