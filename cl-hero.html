<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Colorist Lite hero</title>
<!--
  Hero card background for Colorist Lite: a soft rainbow light leak that follows the cursor,
  over a colour wash with CRT scan lines, under glass: glare, smudges and light-reactive scratches.
  Tune: WIDTH / FAN at the top of the script, blur on .prism-leak, opacity on .prism-scan.

  Hero use: headline copy and a YouTube video sit in front of the effect; the bottom fades into rgb(7,4,18).
  Pick the video in the iframe URL:  cl-hero.html?v=YOUTUBE_ID
-->
<style>
/* Colorist Lite hero card background: fills its window or iframe — a soft rainbow light leak drifts with the cursor over a colour wash; scan lines on top */
@property --p-angle { syntax: "<angle>"; inherits: true; initial-value: 0deg; }

:root {
  --bg: rgb(7,4,18);
  --mx: 50%; --my: 50%;   /* smoothed pointer position (set by JS) */
  --p-on: 0;
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; padding: 0; }
body { background: var(--bg); overflow: hidden; touch-action: none; }

.prism, .prism > * { position: fixed; inset: 0; pointer-events: none; }

/* Colour wash spun around the pointer, heavily blurred */
.prism-spectrum {
  inset: -30%;
  background: conic-gradient(from var(--p-angle) at var(--mx) var(--my),
    #ff2d55, #ff9f0a, #ffd60a, #30d158, #40c8e0, #0a84ff, #5e5ce6, #bf5af2, #ff2d55);
  filter: blur(60px) saturate(1.3);
  opacity: calc(.45 + .2 * var(--p-on));
  animation: p-spin 20s linear infinite;
}
@keyframes p-spin { to { --p-angle: 360deg; } }
.prism-shade {
  background: radial-gradient(circle at var(--mx) var(--my),
    transparent 0%, rgba(7,4,18,.35) 40%, rgba(7,4,18,.85) 95%);
}

/* The light leak, drawn at half resolution and blurred into soft bands */
.prism-leak { width: 100%; height: 100%; filter: blur(28px) saturate(1.15); mix-blend-mode: screen; }

/* Scan lines + slow rolling band */
.prism-scan { background: repeating-linear-gradient(to bottom, rgba(0,0,0,.58) 0 1px, transparent 1px 3px); }
.prism-roll {
  background: linear-gradient(to bottom, transparent 40%, rgba(255,255,255,.06) 50%, transparent 60%);
  background-size: 100% 250%;
  animation: p-roll 7s linear infinite;
}
@keyframes p-roll { from { background-position: 0 130%; } to { background-position: 0 -130%; } }

/* Hero layout in front of the effect: copy on top, video below */
.fade { position: fixed; left: 0; right: 0; bottom: 0; height: 22%; pointer-events: none; z-index: 1;
        background: linear-gradient(to bottom, rgba(7,4,18,0), rgb(7,4,18)); }
.stage { position: fixed; inset: 0; z-index: 2; box-sizing: border-box; padding: 120px 28px 184px;
         display: flex; flex-direction: column; justify-content: center; pointer-events: none; }
.copy { font-family: Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif; }
.eyebrow { margin: 0 0 14px; font-size: 10px; font-weight: 600; letter-spacing: .18em; text-transform: uppercase;
           color: #14f0d2; line-height: 1; }
.copy h1 { margin: 0; font-size: 36px; font-weight: 600; letter-spacing: -.03em; color: #f5f5f7; line-height: 1.1; }
.copy p.lede { margin: 12px 0 0; max-width: 560px; font-size: 14px; font-weight: 400; letter-spacing: .01em;
               color: #c9c6d6; line-height: 1.6; }
.video {
  margin-top: 56px; align-self: center; width: 100%; aspect-ratio: 16 / 9; pointer-events: auto;
  border-radius: 14px; overflow: hidden; background: #000;
  box-shadow: 0 0 0 1px rgba(255,255,255,.08), 0 24px 70px rgba(0,0,0,.6);
}
.video iframe { display: block; width: 100%; height: 100%; border: 0; }

/* Glass (same treatment as the Nebulapunk cards): glare centred on the cursor, smudges it reveals,
   and scratches that only catch the light when they run across the direction to the cursor.
   These sit in the background stack, behind the copy and the video. */
.prism-glare {
  mix-blend-mode: screen;
  opacity: calc(.55 + .45 * var(--p-on));
  background:
    radial-gradient(ellipse 30% 36% at var(--mx) var(--my), rgba(255,255,255,.13) 0%, rgba(255,255,255,.04) 45%, transparent 100%),
    radial-gradient(ellipse 80% 18% at var(--mx) var(--my), rgba(220,235,255,.06) 0%, transparent 100%);
}
.prism-smudge, .prism-scratch { width: 100%; height: 100%; mix-blend-mode: screen; }
.prism-smudge {
  opacity: calc(.35 + .65 * var(--p-on));
  -webkit-mask-image: radial-gradient(ellipse 46% 52% at var(--mx) var(--my), #000 0%, rgba(0,0,0,.35) 50%, transparent 100%);
          mask-image: radial-gradient(ellipse 46% 52% at var(--mx) var(--my), #000 0%, rgba(0,0,0,.35) 50%, transparent 100%);
}

@media (prefers-reduced-motion: reduce) {
  .prism-spectrum, .prism-roll { animation: none; }
}
</style>
</head>
<body>
<div class="prism" aria-hidden="true">
  <div class="prism-spectrum"></div>
  <div class="prism-shade"></div>
  <canvas class="prism-leak" id="leak"></canvas>
  <div class="prism-scan"></div>
  <div class="prism-roll"></div>
  <div class="prism-glare"></div>
  <canvas class="prism-smudge" id="smudge"></canvas>
  <canvas class="prism-scratch" id="scratch"></canvas>
</div>

<div class="fade"></div>
<div class="stage">
  <div class="copy" id="copy">
    <p class="eyebrow">Free &#183; Blender add-on</p>
    <h1>Colour grade in the viewport.</h1>
    <p class="lede">Colorist Lite gives you the essential tools of Colorist Pro in a compact, free suite. Grade live in Blender&#8217;s viewport compositor and see the result as you work.</p>
  </div>
  <div class="video" id="video"></div>
</div>

<script>
// YouTube video from ?v=ID (embedded from this page, so YouTube sees a normal referrer)
(() => {
  const id = (new URLSearchParams(location.search).get('v') || '').replace(/[^\w-]/g, '');
  if (!id) return;
  const f = document.createElement('iframe');
  f.src = 'https://www.youtube.com/embed/' + id + '?rel=0&modestbranding=1&playsinline=1';
  f.title = 'Colorist Lite overview';
  f.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share; fullscreen';
  f.allowFullscreen = true;
  f.referrerPolicy = 'strict-origin-when-cross-origin';
  document.getElementById('video').appendChild(f);
})();
// Size the video to the space left under the copy (full width when there's room)
(() => {
  const stage = document.querySelector('.stage'), copy = document.getElementById('copy'), v = document.getElementById('video');
  function fit() {
    const cs = getComputedStyle(stage);
    const innerW = stage.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    const innerH = stage.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
    const availH = innerH - copy.offsetHeight - 56;
    v.style.width = Math.max(160, Math.min(innerW, availH * 16 / 9)) + 'px';
  }
  addEventListener('resize', fit); fit();
})();
</script>
<script>
(() => {
  const root = document.documentElement;
  const cv = document.getElementById('leak');
  const ctx = cv.getContext('2d');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  const SCALE = 0.5;     // render resolution (blurred anyway)
  const SLICES = 24;     // spectrum resolution
  const WIDTH = 0.45;    // band width as a fraction of the shorter screen side
  const FAN = 0.35;      // how much the band widens toward its ends

  let W = 0, H = 0;
  function resize() {
    W = cv.width = Math.round(innerWidth * SCALE);
    H = cv.height = Math.round(innerHeight * SCALE);
  }
  addEventListener('resize', resize); resize();

  // Wavelength (nm) → RGB, yellow-green brightest, red/violet softer
  function spectral(nm) {
    let r = 0, g = 0, b = 0;
    if (nm < 440) { r = -(nm - 440) / 60; b = 1; }
    else if (nm < 490) { g = (nm - 440) / 50; b = 1; }
    else if (nm < 510) { g = 1; b = -(nm - 510) / 20; }
    else if (nm < 580) { r = (nm - 510) / 70; g = 1; }
    else if (nm < 645) { r = 1; g = -(nm - 645) / 65; }
    else { r = 1; }
    const edge = nm < 420 ? .4 + .6 * (nm - 380) / 40 : nm > 700 ? .4 + .6 * (750 - nm) / 50 : 1;
    const lum = .6 + .4 * Math.exp(-Math.pow((nm - 565) / 90, 2));
    return [r, g, b].map(v => Math.round(255 * Math.pow(Math.max(0, v * edge * lum), .8)));
  }

  // Each colour trails the cursor at its own speed, so fast moves smear the band apart
  const slices = Array.from({ length: SLICES }, (_, i) => {
    const t = i / (SLICES - 1);
    return { t, rgb: spectral(700 - t * 300), k: .16 - .1 * t, x: .5, y: .5 };
  });

  let tx = .5, ty = .5, cx = .5, cy = .5, on = 0, present = false, lastMove = 0, rot = -.5;
  addEventListener('pointermove', e => {
    tx = e.clientX / innerWidth; ty = e.clientY / innerHeight;
    present = true; lastMove = performance.now();
  });
  document.addEventListener('pointerleave', () => { present = false; });
  addEventListener('blur', () => { present = false; });

  function frame(now) {
    const s = now / 1000;
    const idle = !present || now - lastMove > 4000;
    if (idle) {
      tx = .5 + Math.sin(s * .21) * .28;
      ty = .5 + Math.cos(s * .16) * .22;
    }
    on += ((idle ? 0 : 1) - on) * .05;

    const pcx = cx, pcy = cy;
    cx += (tx - cx) * (reduce ? 1 : .12);
    cy += (ty - cy) * (reduce ? 1 : .12);
    for (const sl of slices) {
      const k = reduce ? 1 : sl.k;
      sl.x += (tx - sl.x) * k; sl.y += (ty - sl.y) * k;
    }

    // Band angle: slow drift, leans with horizontal position and with motion
    const vx = (cx - pcx) * innerWidth, vy = (cy - pcy) * innerHeight;
    const target = -.55 + Math.sin(s * .07) * .25 + (cx - .5) * .6
                 + Math.max(-.3, Math.min(.3, (vy - vx * .4) * .03));
    rot += (target - rot) * .05;

    root.style.setProperty('--mx', (cx * 100).toFixed(2) + '%');
    root.style.setProperty('--my', (cy * 100).toFixed(2) + '%');
    root.style.setProperty('--p-on', on.toFixed(3));
    window.__glare = { x: cx, y: cy, on };   // shared with the glass scratches

    const band = Math.min(W, H) * WIDTH * (1 + Math.sin(s * .5) * .08);  // slow breathing
    const len = Math.hypot(W, H) * 1.3;
    const step = band / SLICES;
    const gain = .8 + .2 * on;

    ctx.clearRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'lighter';

    for (const sl of slices) {
      const [r, g, b] = sl.rgb;
      const off = (sl.t - .5) * band;          // position across the band
      ctx.save();
      ctx.translate(sl.x * W, sl.y * H);
      ctx.rotate(rot);

      // fade toward both ends; a little brighter around the cursor
      const grad = ctx.createLinearGradient(-len / 2, 0, len / 2, 0);
      grad.addColorStop(0, `rgba(${r},${g},${b},0)`);
      grad.addColorStop(.35, `rgba(${r},${g},${b},${.18 * gain})`);
      grad.addColorStop(.5, `rgba(${r},${g},${b},${.32 * gain})`);
      grad.addColorStop(.65, `rgba(${r},${g},${b},${.18 * gain})`);
      grad.addColorStop(1, `rgba(${r},${g},${b},0)`);
      ctx.fillStyle = grad;

      // each stripe fans outward slightly toward its ends
      const th = step * 2.4;
      const spread = off * FAN;
      ctx.beginPath();
      ctx.moveTo(-len / 2, off - spread - th / 2);
      ctx.lineTo(0, off - th / 2);
      ctx.lineTo(len / 2, off + spread - th / 2);
      ctx.lineTo(len / 2, off + spread + th / 2);
      ctx.lineTo(0, off + th / 2);
      ctx.lineTo(-len / 2, off - spread + th / 2);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    ctx.globalCompositeOperation = 'source-over';
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
<script>
/* Glass wear: smudges (static) and scratches lit by the glare each frame. Fixed seed, so the glass
   looks the same on every visit. */
(() => {
  const smCv = document.getElementById('smudge');
  const scCv = document.getElementById('scratch'), scX = scCv.getContext('2d');
  let CW = 1, CH = 1, dpr = 1, scratches = [], micro = new Float32Array(0);
  const rng = s => () => (s = (s * 16807) % 2147483647) / 2147483647;
  const noise1 = rnd => { const k = Array.from({ length: 12 }, rnd);
    return u => { const x = u * 11, i = Math.floor(x), f = x - i, t = f * f * (3 - 2 * f);
                  return k[i] * (1 - t) + k[Math.min(11, i + 1)] * t; }; };

  function build() {
    CW = Math.max(1, innerWidth); CH = Math.max(1, innerHeight);
    dpr = Math.min(2, window.devicePixelRatio || 1);
    const area = (CW * CH) / (1200 * 675);
    const sc = Math.max(.85, Math.min(1.2, Math.min(CW, CH) / 600));

    // ----- smudges -----
    smCv.width = Math.round(CW * dpr); smCv.height = Math.round(CH * dpr);
    const c = smCv.getContext('2d'), rnd = rng(17), W = smCv.width, H = smCv.height, k = dpr * sc;
    c.clearRect(0, 0, W, H);
    const blob = (x, y, rx, ry, rot, a) => {
      c.save(); c.translate(x, y); c.rotate(rot); c.scale(1, ry / rx);
      const g = c.createRadialGradient(0, 0, 0, 0, 0, rx);
      g.addColorStop(0, `rgba(255,255,255,${a})`); g.addColorStop(.3, `rgba(255,255,255,${a * .75})`);
      g.addColorStop(.6, `rgba(255,255,255,${a * .3})`); g.addColorStop(.85, `rgba(255,255,255,${a * .08})`);
      g.addColorStop(1, 'rgba(255,255,255,0)');
      c.fillStyle = g; c.beginPath(); c.arc(0, 0, rx, 0, Math.PI * 2); c.fill(); c.restore();
    };
    for (let i = 0; i < Math.max(8, Math.round(40 * area)); i++)
      blob(rnd() * W, rnd() * H, (100 + rnd() * 260) * k, (70 + rnd() * 190) * k, rnd() * Math.PI, .025 + rnd() * .04);
    for (let j = 0; j < Math.max(2, Math.round(7 * area) + 1); j++) {
      let x = rnd() * W, y = rnd() * H, a = rnd() * Math.PI * 2; const turn = (rnd() - .5) * .05;
      for (let i = 0; i < 22; i++) { blob(x, y, (45 + rnd() * 35) * k, (14 + rnd() * 10) * k, a, .03 + rnd() * .03);
        x += Math.cos(a) * 20 * k; y += Math.sin(a) * 20 * k; a += turn; }
    }
    for (let i = 0; i < Math.max(2, Math.round(6 * area)); i++)
      blob(rnd() * W, rnd() * H, (40 + rnd() * 20) * k, (55 + rnd() * 25) * k, rnd() * Math.PI, .06 + rnd() * .04);
    for (let i = 0; i < Math.max(12, Math.round(60 * area)); i++) {
      const d = (2.5 + rnd() * 3.5) * dpr; blob(rnd() * W, rnd() * H, d, d, 0, .14 + rnd() * .16); }

    // ----- scratches (geometry; lit per frame) -----
    scCv.width = Math.round(CW * dpr); scCv.height = Math.round(CH * dpr);
    const R = rng(37); scratches = [];
    const make = (x, y, ang, len, curve, depth, width) => {
      const n = Math.max(3, Math.round(len / 6)), nz = noise1(R), pts = [];
      let a = ang, px = x, py = y;
      for (let i = 0; i <= n; i++) {
        const u = i / n, taper = Math.pow(Math.sin(Math.PI * u), .6);
        let d = depth * taper * (.35 + .65 * nz(u)); if (nz(1 - u) < .22) d *= .08;
        pts.push(px, py, d); a += curve / n; px += Math.cos(a) * len / n; py += Math.sin(a) * len / n;
      }
      scratches.push({ pts, width, minX: Math.min(x, px) - 10, maxX: Math.max(x, px) + 10,
                       minY: Math.min(y, py) - 10, maxY: Math.max(y, py) + 10 });
    };
    for (let j = 0; j < Math.max(3, Math.round(14 * area) + 1); j++) {
      const ox = R() * CW, oy = R() * CH, base = R() * Math.PI, curve = (R() - .5) * .9;
      const count = 20 + Math.round(R() * 34);
      for (let i = 0; i < count; i++) {
        const off = (R() - .5) * 90 * sc;
        make(ox + Math.cos(base + Math.PI / 2) * off + (R() - .5) * 60 * sc,
             oy + Math.sin(base + Math.PI / 2) * off + (R() - .5) * 60 * sc,
             base + (R() - .5) * .12, (30 + R() * 190) * sc, curve + (R() - .5) * .15, .35 + R() * .5, .45 + R() * .3);
      }
    }
    for (let i = 0; i < Math.max(2, Math.round(10 * area)); i++)
      make(R() * CW, R() * CH, R() * Math.PI * 2, (160 + R() * 420) * sc, (R() - .5) * .6, .7 + R() * .3, .7 + R() * .5);
    for (let i = 0; i < Math.max(150, Math.round(700 * area)); i++)
      make(R() * CW, R() * CH, R() * Math.PI * 2, 4 + R() * 22, (R() - .5) * .4, .25 + R() * .45, .4 + R() * .25);
    const M = rng(59), nMicro = Math.max(700, Math.round(3200 * area));
    micro = new Float32Array(nMicro * 5);
    const patches = Array.from({ length: 6 }, () => [M() * CW, M() * CH, (60 + M() * 120) * sc]);
    for (let i = 0; i < nMicro; i++) {
      let x, y;
      if (M() < .4) { const [px, py, pr] = patches[Math.floor(M() * 6)]; const a = M() * Math.PI * 2, d = pr * Math.sqrt(M());
                       x = px + Math.cos(a) * d; y = py + Math.sin(a) * d; }
      else { x = M() * CW; y = M() * CH; }
      const a = M() * Math.PI * 2, len = (1.5 + M() * 4.5) * Math.max(1, sc * 1.2);
      micro.set([x, y, x + Math.cos(a) * len, y + Math.sin(a) * len, .45 + M() * .55], i * 5);
    }
  }

  const LEVELS = 16;
  const paths = Array.from({ length: LEVELS }, () => []), microPaths = Array.from({ length: LEVELS }, () => []);
  function frame() {
    const g = window.__glare || { x: .5, y: .5, on: 0 };
    const lx = g.x * CW, ly = g.y * CH, on = g.on;
    const reach = Math.min(CW, CH) * .5, gain = .28 + .72 * on;
    scX.setTransform(dpr, 0, 0, dpr, 0, 0); scX.clearRect(0, 0, CW, CH);
    for (const p of paths) p.length = 0; for (const p of microPaths) p.length = 0;
    const r2 = reach * 1.6;
    for (const s of scratches) {
      if (s.maxX < lx - r2 || s.minX > lx + r2 || s.maxY < ly - r2 || s.minY > ly + r2) continue;
      const P = s.pts;
      for (let i = 0; i < P.length - 3; i += 3) {
        const x0 = P[i], y0 = P[i + 1], x1 = P[i + 3], y1 = P[i + 4], depth = (P[i + 2] + P[i + 5]) * .5;
        if (depth < .02) continue;
        const dx = (x0 + x1) * .5 - lx, dy = (y0 + y1) * .5 - ly, dist = Math.hypot(dx, dy) || 1;
        const fall = Math.exp(-(dist / reach) * (dist / reach)); if (fall < .02) continue;
        const ux = x1 - x0, uy = y1 - y0, tl = Math.hypot(ux, uy) || 1;
        const cos = (ux * dx + uy * dy) / (tl * dist), spec = Math.exp(-(cos * cos) / .06);
        const b = Math.min(1, depth * fall * (.05 + .95 * spec) * gain * 1.0);
        const lvl = Math.min(LEVELS - 1, Math.round(b * (LEVELS - 1))); if (lvl < 1) continue;
        paths[lvl].push(x0, y0, x1, y1, s.width);
      }
    }
    for (let i = 0; i < micro.length; i += 5) {
      const x0 = micro[i], y0 = micro[i + 1], dx = x0 - lx, dy = y0 - ly;
      if (dx > r2 || dx < -r2 || dy > r2 || dy < -r2) continue;
      const dist = Math.hypot(dx, dy) || 1, fall = Math.exp(-(dist / reach) * (dist / reach)); if (fall < .03) continue;
      const ux = micro[i + 2] - x0, uy = micro[i + 3] - y0, tl = Math.hypot(ux, uy) || 1;
      const cos = (ux * dx + uy * dy) / (tl * dist), spec = Math.exp(-(cos * cos) / .015);
      const b = Math.min(1, micro[i + 4] * fall * spec * gain * 1.6);
      const lvl = Math.min(LEVELS - 1, Math.round(b * (LEVELS - 1))); if (lvl < 1) continue;
      microPaths[lvl].push(x0, y0, micro[i + 2], micro[i + 3]);
    }
    scX.lineCap = 'round'; scX.lineWidth = .35;
    for (let l = 1; l < LEVELS; l++) { const p = microPaths[l]; if (!p.length) continue;
      scX.strokeStyle = `rgba(255,255,255,${(l / LEVELS).toFixed(3)})`; scX.beginPath();
      for (let i = 0; i < p.length; i += 4) { scX.moveTo(p[i], p[i + 1]); scX.lineTo(p[i + 2], p[i + 3]); }
      scX.stroke(); }
    for (let l = 1; l < LEVELS; l++) { const p = paths[l]; if (!p.length) continue;
      scX.strokeStyle = `rgba(236,242,255,${(l / LEVELS).toFixed(3)})`;
      for (const wide of [false, true]) { scX.lineWidth = wide ? .95 : .55; scX.beginPath();
        for (let i = 0; i < p.length; i += 5) { if ((p[i + 4] > .75) !== wide) continue;
          scX.moveTo(p[i], p[i + 1]); scX.lineTo(p[i + 2], p[i + 3]); }
        scX.stroke(); } }
    requestAnimationFrame(frame);
  }
  let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(build, 150); });
  build();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
